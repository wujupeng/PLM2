services:
  postgres:
    image: postgres:16-alpine
    container_name: plm2-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLM_POSTGRES_DB:-plm2}
      POSTGRES_USER: ${PLM_POSTGRES_USER:-plm2}
      POSTGRES_PASSWORD: ${PLM_POSTGRES_PASSWORD:?Set PLM_POSTGRES_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:${PLM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - plm2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  plm2-postgres-data:
