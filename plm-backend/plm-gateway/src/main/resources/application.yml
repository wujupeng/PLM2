server:
  port: 8080
  netty:
    connection-timeout: 5000

spring:
  application:
    name: plm-gateway
  cloud:
    gateway:
      routes:
        # N1 统一平台基础能力：认证与系统管理均由 plm-system 提供
        # plm-system 的控制器路径为 /auth/** 与 /system/**，因此仅剥离 /api 前缀
        - id: system-auth-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: system-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        # N2 产品、物料与多级 BOM 主数据：控制器路径为 /product-data/** 与 /bom/**，仅剥离 /api 前缀
        - id: product-data-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/product-data/**
          filters:
            - StripPrefix=1
        - id: bom-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/bom/**
          filters:
            - StripPrefix=1
        # N3 图文档、CAD 关联与工程变更：控制器路径为 /document/**、/cad/**、/eco/**，仅剥离 /api 前缀
        - id: eco-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/eco/**
          filters:
            - StripPrefix=1
        - id: document-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/document/**
          filters:
            - StripPrefix=1
        - id: cad-integration-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/cad/**
          filters:
            - StripPrefix=1
        # N4 技术规格、线束、环保、包装、工艺、检验与质量：控制器路径为 /spec/**、/harness/**、/compliance/**、
        # /packaging/**、/process/**、/inspection/**、/quality/**，仅剥离 /api 前缀
        - id: spec-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/spec/**
          filters:
            - StripPrefix=1
        - id: harness-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/harness/**
          filters:
            - StripPrefix=1
        - id: compliance-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/compliance/**
          filters:
            - StripPrefix=1
        - id: packaging-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/packaging/**
          filters:
            - StripPrefix=1
        - id: process-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/process/**
          filters:
            - StripPrefix=1
        - id: inspection-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/inspection/**
          filters:
            - StripPrefix=1
        - id: quality-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/quality/**
          filters:
            - StripPrefix=1
        # N5 编码与标签：控制器路径为 /code/**、/relabel/**、/label/**，仅剥离 /api 前缀
        - id: code-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/code/**
          filters:
            - StripPrefix=1
        - id: relabel-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/relabel/**
          filters:
            - StripPrefix=1
        - id: label-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/label/**
          filters:
            - StripPrefix=1
        # N6 EDI 客户需求与供应商协同：控制器路径为 /edi/**，仅剥离 /api 前缀
        - id: edi-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/edi/**
          filters:
            - StripPrefix=1
        # N7 物料供应、Kanban、FIFO 与缺料管理：控制器路径为 /wms/**，仅剥离 /api 前缀
        - id: wms-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/wms/**
          filters:
            - StripPrefix=1
        # N8 生产执行与发货追溯：控制器路径为 /mfg/**，仅剥离 /api 前缀
        - id: mfg-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/mfg/**
          filters:
            - StripPrefix=1
        # N9 系统集成、迁移、性能安全与上线交付：控制器路径为 /int/**，仅剥离 /api 前缀
        - id: int-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/int/**
          filters:
            - StripPrefix=1
        # 数据迁移控制器位于系统服务 /mig/** 下。
        - id: migration-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/mig/**
          filters:
            - StripPrefix=1
        # OA 2.0 统一门户与身份组织权限：控制器路径为 /oa/**，仅剥离 /api 前缀
        - id: oa-service
          uri: ${PLM_SYSTEM_URI:http://localhost:8082}
          predicates:
            - Path=/api/oa/**
          filters:
            - StripPrefix=1
        - id: manufacturing-service
          uri: lb://plm-manufacturing
          predicates:
            - Path=/api/manufacturing/**
          filters:
            - StripPrefix=2
        - id: integration-service
          uri: lb://plm-integration
          predicates:
            - Path=/api/integration/**
          filters:
            - StripPrefix=2
        - id: auth-workflow-service
          uri: lb://plm-auth-workflow
          predicates:
            - Path=/api/auth-workflow/**
          filters:
            - StripPrefix=2
        - id: admin-service
          uri: lb://plm-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2
        - id: notification-service
          uri: lb://plm-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2
        - id: search-service
          uri: lb://plm-search
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
        - name: RequestSize
          args:
            maxSize: 52428800
  data:
    redis:
      host: ${PLM_REDIS_HOST:127.0.0.1}
      port: ${PLM_REDIS_PORT:6381}
      password: ${PLM_REDIS_PASSWORD}
      database: ${PLM_REDIS_DATABASE:0}
      timeout: ${PLM_REDIS_TIMEOUT:3s}
      connect-timeout: ${PLM_REDIS_CONNECT_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${PLM_REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${PLM_REDIS_POOL_MAX_IDLE:8}
          min-idle: ${PLM_REDIS_POOL_MIN_IDLE:1}
          max-wait: ${PLM_REDIS_POOL_MAX_WAIT:3s}

plm:
  jwt:
    secret: ${PLM_JWT_SECRET}
    access-token-expiration: 3600
    refresh-token-expiration: 86400
  gateway:
    auth:
      enabled: true
    rate-limit:
      enabled: true
      default-limit: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.huaweicloud.plm: INFO
    org.springframework.cloud.gateway: INFO
