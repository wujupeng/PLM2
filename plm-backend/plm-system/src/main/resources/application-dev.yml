# 本地开发：使用内嵌 H2（PostgreSQL 兼容模式），无需外部数据库即可启动，便于 N0/N1 阶段联调。
# 生产与预生产环境统一使用 PostgreSQL，见 application-prod.yml。
spring:
  datasource:
    url: jdbc:h2:mem:plm_system;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    clean-disabled: false

logging:
  level:
    com.huaweicloud.plm: DEBUG
