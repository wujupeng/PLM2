# 本地开发：使用文件 H2（PostgreSQL 兼容模式）并保留重启数据；start-dev.sh 会设置仓库内绝对路径。
# 生产与预生产环境统一使用 PostgreSQL，见 application-prod.yml。
spring:
  datasource:
    url: ${PLM_DATASOURCE_URL:jdbc:h2:file:../.local/dev-h2/plm_system;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    clean-disabled: false

logging:
  level:
    com.huaweicloud.plm: DEBUG
