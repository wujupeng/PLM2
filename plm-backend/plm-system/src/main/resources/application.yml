server:
  port: 8082

spring:
  application:
    name: plm-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 容器侧上传上限；业务侧上限由可配置项 oa.mail.attachment.max.size.mb / oa.doc.upload.max.size.mb 控制，两者需保持同步
      max-file-size: 50MB
      max-request-size: 100MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 通知模板正文中包含 ${变量名} 占位符，需保留原文入库，故关闭 Flyway 占位符替换
    placeholder-replacement: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

plm:
  jwt:
    secret: ${PLM_JWT_SECRET}
    access-token-expiration: 3600
    refresh-token-expiration: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: ${PLM_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${PLM_API_DOCS_ENABLED:false}

knife4j:
  enable: ${PLM_API_DOCS_ENABLED:false}

logging:
  level:
    com.huaweicloud.plm: INFO
